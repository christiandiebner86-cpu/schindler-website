name: Add Schindler application form
on:
  push:
    paths:
      - '.github/workflows/fix-hero-medical.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add quick application section
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('href="mailto:intensivpflegeschindler@gmail.com?subject=Bewerbung%20Intensivpflege%20Schindler">Jetzt bewerben →</a>','href="#bewerbung">Jetzt bewerben →</a>',1)
          marker='<section class="contact" id="kontakt">'
          if marker not in s:
              raise SystemExit('contact marker not found')
          block='''<section class="about" id="bewerbung"><div class="wrap"><div class="section-title"><h2>Schnellbewerbung</h2><p>Pflegefachkraft? Bewirb dich in wenigen Minuten – ganz ohne Anschreiben.</p></div><div class="contact-panel" style="max-width:820px;margin:auto"><form action="mailto:intensivpflegeschindler@gmail.com" method="post" enctype="text/plain"><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><label><strong>Name *</strong><input required name="Name" autocomplete="name" style="width:100%;padding:13px;margin-top:6px;border:1px solid #cbdde2;border-radius:10px;font:inherit"></label><label><strong>Telefon *</strong><input required name="Telefon" type="tel" autocomplete="tel" style="width:100%;padding:13px;margin-top:6px;border:1px solid #cbdde2;border-radius:10px;font:inherit"></label></div><label style="display:block;margin-top:16px"><strong>Qualifikation *</strong><select required name="Qualifikation" style="width:100%;padding:13px;margin-top:6px;border:1px solid #cbdde2;border-radius:10px;font:inherit;background:white"><option value="">Bitte auswählen</option><option>Pflegefachfrau / Pflegefachmann</option><option>Gesundheits- und Krankenpfleger/in</option><option>Altenpfleger/in</option><option>Andere Pflegefachkraft</option></select></label><label style="display:block;margin-top:16px"><strong>Nachricht (optional)</strong><textarea name="Nachricht" rows="4" style="width:100%;padding:13px;margin-top:6px;border:1px solid #cbdde2;border-radius:10px;font:inherit"></textarea></label><p style="font-size:13px;color:#65758a">Mit dem Absenden erklärst du dich mit der Verarbeitung deiner Angaben zur Bearbeitung der Bewerbung gemäß unserer Datenschutzerklärung einverstanden.</p><button class="btn primary" type="submit" style="cursor:pointer;font:inherit">Bewerbung senden →</button></form></div></div></section>
'''
          s=s.replace(marker,block+marker,1)
          s=s.replace('<a class="mobile-apply" href="#kontakt">','<a class="mobile-apply" href="#bewerbung">',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Schindler quick application form'
          git push
