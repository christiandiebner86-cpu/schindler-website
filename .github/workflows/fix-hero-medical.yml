name: Restore previous Schindler hero image
on:
  push:
    paths:
      - '.github/workflows/fix-hero-medical.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous hero
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='schindler-hero-mask.jpg'
          new='https://christiandiebner86-cpu.github.io/halle-website-test/hero-intensivpflege.png'
          if old not in s:
              raise SystemExit('current hero image not found')
          s=s.replace(old,new,1)
          s=s.replace('alt="Außerklinische Intensivpflege mit nicht-invasiver Maskenbeatmung"','alt="Persönliche außerklinische Intensivpflege"',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore previous Schindler hero image'
          git push
