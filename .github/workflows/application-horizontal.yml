name: Horizontal application layout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/application-horizontal.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Restyle form
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          a=s.index('<section class="about" id="bewerbung">'); b=s.index('<section class="contact" id="kontakt">',a)
          html='''<section id="bewerbung" class="quick-apply"><div class="wrap"><div class="quick-box"><div class="quick-copy"><h2>◷ In 60 Sekunden bewerben.</h2><p>Kein Anschreiben nötig.<br>Lebenslauf optional.<br>Wir melden uns schnellstmöglich bei dir.</p></div><form id="bewerbungsformular" class="quick-form"><div class="quick-fields"><input required name="name" autocomplete="name" placeholder="Dein Name *"><input required name="phone" type="tel" autocomplete="tel" placeholder="Telefonnummer *"><input name="email" type="email" autocomplete="email" placeholder="E-Mail (optional)"><select required name="qualification"><option value="">Qualifikation *</option><option>Pflegefachfrau / Pflegefachmann</option><option>Gesundheits- und Krankenpfleger/in</option><option>Altenpfleger/in</option><option>Andere Pflegefachkraft</option></select><textarea name="message" rows="3" placeholder="Nachricht (optional)"></textarea></div><label class="quick-file"><strong>📎 Anhang / Lebenslauf hinzufügen (optional)</strong><input name="attachment" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/jpeg,image/png"><small>PDF, Word, JPG oder PNG · max. 10 MB</small></label><div class="quick-bottom"><p>🔒 Deine Angaben werden ausschließlich zur Bearbeitung deiner Bewerbung verwendet. Mit dem Absenden stimmst du der Verarbeitung gemäß unserer <a href="#datenschutz">Datenschutzerklärung</a> zu.</p><button id="bewerbung-submit" class="quick-submit" type="submit">Jetzt bewerben →</button></div><p id="bewerbung-status" class="form-status" role="status" aria-live="polite"></p></form></div></div></section>\n'''
          s=s[:a]+html+s[b:]
          css='''\n.quick-apply{padding:34px 0!important;background:#f1fbfd;scroll-margin-top:110px}.quick-box{background:linear-gradient(115deg,#173653,#087f8c);border-radius:22px;padding:30px 34px;display:grid;grid-template-columns:36% 64%;gap:30px;color:#fff;box-shadow:0 12px 35px #17365322}.quick-copy h2{margin:5px 0 14px;color:#b9f45c;font-size:34px;line-height:1.1}.quick-copy p{margin:0;font-size:17px;line-height:1.7;color:#eef8fa}.quick-form{min-width:0}.quick-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.quick-fields input,.quick-fields select,.quick-fields textarea{width:100%;height:52px;border:0;border-radius:12px;background:#fff;color:#20354a;padding:12px 15px;font:inherit;outline:none}.quick-fields textarea{height:116px;grid-column:3;grid-row:1/3;resize:vertical}.quick-fields input[name=email]{grid-column:1}.quick-file{display:block;margin-top:12px;background:#ffffff18;border-radius:13px;padding:12px 14px}.quick-file strong{display:block;margin-bottom:7px}.quick-file input{width:100%;background:#fff;color:#20354a;border-radius:9px;padding:9px;font:inherit}.quick-file small{display:block;margin-top:5px;color:#e4f1f4}.quick-bottom{display:grid;grid-template-columns:1fr 44%;gap:18px;align-items:center;margin-top:12px}.quick-bottom p{margin:0;font-size:11px;line-height:1.4;color:#e4f1f4}.quick-bottom a{color:#fff}.quick-submit{border:0;border-radius:14px;background:#9bd552;color:#173653;font:inherit;font-weight:900;padding:15px 20px;cursor:pointer;width:100%}.quick-submit:hover{filter:brightness(.96)}.quick-apply .form-status{color:#fff;margin:8px 0 0}.quick-apply .form-status.error{color:#ffd4d4}.quick-apply .form-status.ok{color:#c8ff80}@media(max-width:1000px){.quick-box{grid-template-columns:1fr;padding:26px}.quick-copy p br{display:none}.quick-fields{grid-template-columns:1fr 1fr}.quick-fields textarea{grid-column:1/-1;grid-row:auto;height:80px}}@media(max-width:650px){.quick-apply{padding:24px 0!important}.quick-box{padding:20px 16px;border-radius:17px;gap:18px}.quick-copy h2{font-size:27px}.quick-copy p{font-size:15px}.quick-fields{grid-template-columns:1fr;gap:9px}.quick-fields input[name=email],.quick-fields textarea{grid-column:auto}.quick-fields textarea{height:72px}.quick-bottom{grid-template-columns:1fr;gap:9px}.quick-file{padding:10px}.quick-submit{padding:14px}}\n'''
          s=s.replace('</style>',css+'</style>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign Schnellbewerbung in compact horizontal layout"
          git pull --rebase origin main
          git push