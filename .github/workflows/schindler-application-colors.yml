name: Schindler application colors
on:
  push:
    branches: [main]
    paths: ['.github/workflows/schindler-application-colors.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply Schindler palette
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('background:linear-gradient(115deg,#173653,#087f8c);border-radius:22px','background:linear-gradient(115deg,#078f9d,#087f8c);border-radius:22px')
          s=s.replace('color:#b9f45c;font-size:34px','color:#fff;font-size:34px')
          s=s.replace('background:#9bd552;color:#173653;font:inherit;font-weight:900','background:#fff;color:#087f8c;font:inherit;font-weight:900')
          s=s.replace('.quick-submit:hover{filter:brightness(.96)}','.quick-submit:hover{background:#eaf8fa;color:#173653;transform:translateY(-1px)}')
          s=s.replace('background:#ffffff18;border-radius:13px','background:#17365326;border:1px solid #ffffff35;border-radius:13px')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use Schindler turquoise palette for Schnellbewerbung"
          git pull --rebase origin main
          git push